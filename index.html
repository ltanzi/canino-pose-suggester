<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canino FM · Pose Suggester</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__head">
        <img
          class="logo"
          src="./logo/main-black-CMYK-canino.png"
          alt="Canino FM"
          width="48"
          height="55"
        />
        <h1>Pose Suggester</h1>
      </header>

      <section class="sizes" aria-label="Group size">
        <button class="pill" data-size="1" aria-pressed="true">1</button>
        <button class="pill" data-size="2" aria-pressed="false">2</button>
        <button class="pill" data-size="3" aria-pressed="false">3</button>
        <button class="pill" data-size="4" aria-pressed="false">4</button>
        <button class="pill" data-size="5" aria-pressed="false">5</button>
      </section>

      <section class="actions">
        <button id="back" class="btn" disabled>Back</button>
        <button id="generate" class="btn btn--primary">Generate</button>
      </section>

      <div id="pose-label" aria-live="polite"></div>

      <div class="canvas-row">
        <aside class="legend" aria-label="Face guide">
          <div class="legend__item">
            <span class="legend__label">Front</span>
            <svg class="legend__face" viewBox="0 0 60 60" aria-hidden="true">
              <circle cx="30" cy="30" r="18" />
              <line x1="22.4" y1="26" x2="26"   y2="26" />
              <line x1="34"   y1="26" x2="37.6" y2="26" />
              <line x1="22.8" y1="32.9" x2="30" y2="35.8" />
              <line x1="30"   y1="35.8" x2="37.2" y2="32.9" />
            </svg>
          </div>
          <div class="legend__item">
            <span class="legend__label">Right side</span>
            <svg class="legend__face" viewBox="0 0 60 60" aria-hidden="true">
              <circle cx="30" cy="30" r="18" />
              <line x1="36.1" y1="26.4" x2="39.0" y2="26.4" />
              <line x1="42.5" y1="32.9" x2="46.8" y2="36.5" />
              <line x1="48"   y1="28.2" x2="55.2" y2="30" />
              <line x1="55.2" y1="30"   x2="48"   y2="31.8" />
            </svg>
          </div>
          <div class="legend__item">
            <span class="legend__label">Left side</span>
            <svg class="legend__face" viewBox="0 0 60 60" aria-hidden="true">
              <circle cx="30" cy="30" r="18" />
              <line x1="21.0" y1="26.4" x2="23.9" y2="26.4" />
              <line x1="17.5" y1="32.9" x2="13.2" y2="36.5" />
              <line x1="12"   y1="28.2" x2="4.8"  y2="30" />
              <line x1="4.8"  y1="30"   x2="12"   y2="31.8" />
            </svg>
          </div>
          <div class="legend__item">
            <span class="legend__label">Back</span>
            <svg class="legend__face" viewBox="0 0 60 60" aria-hidden="true">
              <circle cx="30" cy="30" r="18" />
            </svg>
          </div>
          <div class="legend__item">
            <span class="legend__label">Looking up</span>
            <svg class="legend__face" viewBox="0 0 60 60" aria-hidden="true">
              <circle cx="30" cy="30" r="18" />
              <line x1="22.4" y1="20.6" x2="26"   y2="20.6" />
              <line x1="34"   y1="20.6" x2="37.6" y2="20.6" />
              <line x1="22.8" y1="25.7" x2="30"   y2="28.6" />
              <line x1="30"   y1="28.6" x2="37.2" y2="25.7" />
            </svg>
          </div>
          <div class="legend__item">
            <span class="legend__label">Floor</span>
            <svg class="legend__face" viewBox="0 0 60 60" aria-hidden="true">
              <circle cx="30" cy="30" r="18" />
              <line x1="26.0" y1="37.6" x2="26.0" y2="34.0" />
              <line x1="26.0" y1="26.0" x2="26.0" y2="22.4" />
              <line x1="32.9" y1="37.2" x2="35.8" y2="30" />
              <line x1="35.8" y1="30"   x2="32.9" y2="22.8" />
            </svg>
          </div>
        </aside>
        <section class="stage" aria-label="Pose canvas">
          <svg
            id="canvas"
            viewBox="0 0 500 800"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Stick-figure pose"
          >
            <image
              id="bg-photo"
              href="./references/empty_elevator.jpg"
              x="0" y="0" width="500" height="800"
              preserveAspectRatio="xMidYMid slice"
              aria-hidden="true"
            />
            <g id="figures"></g>
          </svg>
        </section>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
